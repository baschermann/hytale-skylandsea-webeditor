plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.codehaus.groovy.runtime.GStringImpl
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.internal.os.OperatingSystem

repositories {
    mavenCentral()
}

base {
    archivesName = 'skylandsea'
}

ext {
    if (project.hasProperty('hytale_home')) {
        hytaleHome = project.findProperty('hytale_home') as GStringImpl
    } else {
        def os = OperatingSystem.current()
        if (os.isWindows()) {
            hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
        } else if (os.isMacOsX()) {
            hytaleHome = "${System.getProperty("user.home")}/Library/Application Support/Hytale"
        } else if (os.isLinux()) {
            hytaleHome = "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
            if (!file(hytaleHome).exists()) {
                hytaleHome = "${System.getProperty("user.home")}/.local/share/Hytale"
            }
        }
    }
}

if (!project.hasProperty('hytaleHome')) {
    throw new GradleException('Your Hytale install could not be detected automatically. If you are on an unsupported platform or using a custom install location, please define the install location using the hytale_home property.')
} else if (!file(project.findProperty('hytaleHome')).exists()) {
    throw new GradleException("Failed to find Hytale at the expected location. Please make sure you have installed the game. The expected location can be changed using the hytale_home property. Currently looking in ${project.findProperty('hytaleHome')}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

def hytaleServerJar = file("${hytaleHome}/install/${patchline}/package/game/latest/Server/HytaleServer.jar")

dependencies {
    implementation(files(hytaleServerJar))
    implementation(project(':worldgen-custom-nodes'))
}

def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestJson))
    }
}

tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

tasks.named('jar', org.gradle.jvm.tasks.Jar) {
    dependsOn(':worldgen-custom-nodes:classes')
    from(project(':worldgen-custom-nodes').sourceSets.main.output) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def createServerRunArguments(List<String> extraModSrcMainDirs) {
    def programParameters = '--allow-op --disable-sentry --assets="' + "${hytaleHome}/install/$patchline/package/game/latest/Assets.zip" + '"'
    def modPaths = []
    if (includes_pack.toBoolean()) {
        modPaths << sourceSets.main.java.srcDirs.first().parentFile.absolutePath
    }
    if (extraModSrcMainDirs != null) {
        extraModSrcMainDirs.each { p ->
            if (p != null && !p.toString().isBlank()) {
                modPaths << p.toString()
            }
        }
    }
    if (load_user_mods.toBoolean()) {
        modPaths << "${hytaleHome}/UserData/Mods"
    }
    if (!modPaths.isEmpty()) {
        programParameters += ' --mods="' + modPaths.join(',') + '"'
    }
    return programParameters
}

def parseArgs(String argsStr) {
    def args = []
    def current = new StringBuilder()
    boolean inQuotes = false

    argsStr.toCharArray().each { char c ->
        if (c == '"') {
            inQuotes = !inQuotes
        } else if (c == ' ' as char && !inQuotes) {
            if (current.length() > 0) {
                args << current.toString()
                current.setLength(0)
            }
        } else {
            current.append(c)
        }
    }

    if (current.length() > 0) {
        args << current.toString()
    }

    return args
}

def editorDevModRoot() {
    file("${rootDir}/../worldgen-web-editor-plugin/src/main").absolutePath
}

tasks.register('runHytaleServer', JavaExec) {
    group = 'application'
    description = 'Runs the Hytale server with skylandsea only'
    mainClass = 'com.hypixel.hytale.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = serverRunDir
    args parseArgs(createServerRunArguments([]))
}

tasks.register('runHytaleServerWithWorldGenDebugger', JavaExec) {
    group = 'application'
    description = 'Runs skylandsea together with the node editor / world gen debugger plugin'
    mainClass = 'com.hypixel.hytale.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = serverRunDir
    args parseArgs(createServerRunArguments([editorDevModRoot()]))
}

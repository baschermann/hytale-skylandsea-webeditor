plugins {
    id 'java'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import groovy.xml.XmlUtil
import org.codehaus.groovy.runtime.GStringImpl
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.internal.os.OperatingSystem

repositories {
    mavenCentral()
}

base {
    archivesName = 'skylandsea'
}

ext {
    if (project.hasProperty('hytale_home')) {
        hytaleHome = project.findProperty('hytale_home') as GStringImpl
    } else {
        def os = OperatingSystem.current()
        if (os.isWindows()) {
            hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
        } else if (os.isMacOsX()) {
            hytaleHome = "${System.getProperty("user.home")}/Library/Application Support/Hytale"
        } else if (os.isLinux()) {
            hytaleHome = "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
            if (!file(hytaleHome).exists()) {
                hytaleHome = "${System.getProperty("user.home")}/.local/share/Hytale"
            }
        }
    }
}

if (!project.hasProperty('hytaleHome')) {
    throw new GradleException('Your Hytale install could not be detected automatically. If you are on an unsupported platform or using a custom install location, please define the install location using the hytale_home property.')
} else if (!file(project.findProperty('hytaleHome')).exists()) {
    throw new GradleException("Failed to find Hytale at the expected location. Please make sure you have installed the game. The expected location can be changed using the hytale_home property. Currently looking in ${project.findProperty('hytaleHome')}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

def hytaleServerJar = file("${hytaleHome}/install/${patchline}/package/game/latest/Server/HytaleServer.jar")

dependencies {
    implementation(files(hytaleServerJar))
    implementation(project(':worldgen-custom-nodes'))
}

def serverRunDir = file("$projectDir/run")
if (!serverRunDir.exists()) {
    serverRunDir.mkdirs()
}

tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Could not find manifest.json at ${manifestFile.path}!")
        }
        def manifestJson = new JsonSlurper().parseText(manifestFile.text)
        manifestJson.Version = version
        manifestJson.IncludesAssetPack = includes_pack.toBoolean()
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifestJson))
    }
}

tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
}

tasks.named('jar', org.gradle.jvm.tasks.Jar) {
    dependsOn(':worldgen-custom-nodes:classes')
    from(project(':worldgen-custom-nodes').sourceSets.main.output) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def createServerRunArguments(List<String> extraModSrcMainDirs) {
    def programParameters = '--allow-op --disable-sentry --assets="' + "${hytaleHome}/install/$patchline/package/game/latest/Assets.zip" + '"'
    def modPaths = []
    if (includes_pack.toBoolean()) {
        modPaths << sourceSets.main.java.srcDirs.first().parentFile.absolutePath
    }
    if (extraModSrcMainDirs != null) {
        extraModSrcMainDirs.each { p ->
            if (p != null && !p.toString().isBlank()) {
                modPaths << p.toString()
            }
        }
    }
    if (load_user_mods.toBoolean()) {
        modPaths << "${hytaleHome}/UserData/Mods"
    }
    if (!modPaths.isEmpty()) {
        programParameters += ' --mods="' + modPaths.join(',') + '"'
    }
    return programParameters
}

/** IntelliJ path macros: repo paths via $PROJECT_DIR$, Hytale install via $USER_HOME$ (generated for current OS). */
def ideaHytaleHomePrefix() {
    def os = OperatingSystem.current()
    if (os.isWindows()) {
        return '$USER_HOME$/AppData/Roaming/Hytale'
    }
    if (os.isMacOsX()) {
        return '$USER_HOME$/Library/Application Support/Hytale'
    }
    def flatpak = file("${System.getProperty('user.home')}/.var/app/com.hypixel.HytaleLauncher/data/Hytale")
    if (flatpak.exists()) {
        return '$USER_HOME$/.var/app/com.hypixel.HytaleLauncher/data/Hytale'
    }
    return '$USER_HOME$/.local/share/Hytale'
}

def createServerRunArgumentsForIdea(List<String> extraModIdeaPaths) {
    def root = ideaHytaleHomePrefix()
    def programParameters = '--allow-op --disable-sentry --assets="' + "${root}/install/${patchline}/package/game/latest/Assets.zip" + '"'
    def modPaths = []
    if (includes_pack.toBoolean()) {
        modPaths << '$PROJECT_DIR$/src/main'
    }
    if (extraModIdeaPaths != null) {
        extraModIdeaPaths.each { p ->
            if (p != null && !p.toString().isBlank()) {
                modPaths << p.toString()
            }
        }
    }
    if (load_user_mods.toBoolean()) {
        modPaths << "${root}/UserData/Mods"
    }
    if (!modPaths.isEmpty()) {
        programParameters += ' --mods="' + modPaths.join(',') + '"'
    }
    return programParameters
}

def parseArgs(String argsStr) {
    def args = []
    def current = new StringBuilder()
    boolean inQuotes = false

    argsStr.toCharArray().each { char c ->
        if (c == '"') {
            inQuotes = !inQuotes
        } else if (c == ' ' as char && !inQuotes) {
            if (current.length() > 0) {
                args << current.toString()
                current.setLength(0)
            }
        } else {
            current.append(c)
        }
    }

    if (current.length() > 0) {
        args << current.toString()
    }

    return args
}

def editorDevModLibsDir() {
    file("${rootDir}/../worldgen-web-editor-plugin/build/libs").absolutePath
}

def worldgenWebEditorProjectDir = file("${rootDir}/../worldgen-web-editor-plugin")
def worldgenWebEditorGradlew = new File(
        worldgenWebEditorProjectDir,
        OperatingSystem.current().isWindows() ? "gradlew.bat" : "gradlew"
)

tasks.register('buildWorldgenWebEditorJar', Exec) {
    group = 'build'
    description = 'Builds the worldgen-web-editor-plugin fat jar (Spring/Tomcat + Vue dist); required for WorldGen debugger dev run'
    workingDir = worldgenWebEditorProjectDir
    commandLine(worldgenWebEditorGradlew.absolutePath, 'jar', '--no-daemon')
}

tasks.register('runHytaleServer', JavaExec) {
    group = 'application'
    description = 'Runs the Hytale server with skylandsea only'
    mainClass = 'com.hypixel.hytale.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = serverRunDir
    args parseArgs(createServerRunArguments([]))
}

tasks.register('runHytaleServerWithWorldGenDebugger', JavaExec) {
    group = 'application'
    description = 'Runs skylandsea together with the node editor / world gen debugger plugin'
    dependsOn 'buildWorldgenWebEditorJar'
    mainClass = 'com.hypixel.hytale.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = serverRunDir
    args parseArgs(createServerRunArguments([editorDevModLibsDir()]))
}

def xmlAttrEscape(String value) {
    XmlUtil.escapeXml(value ?: '')
}

tasks.register('generateIdeaRunConfigs') {
    group = 'application'
    description = 'Creates default Application run configs in .run/ when missing (./gradlew generateIdeaRunConfigs). Do not add Gradle run configs from other projects to this .run folder; invalid GradleRunConfiguration XML breaks IntelliJ 2025.3 sync.'
    doLast {
        def runDir = file("${rootDir}/.run")

        def moduleName = "${project.name}.main"
        def workingDirMacro = '$PROJECT_DIR$/run'
        def serverOnlyXml = """<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="HytaleServer (Skylandsea)" type="Application" factoryName="Application">
    <option name="MAIN_CLASS_NAME" value="com.hypixel.hytale.Main" />
    <module name="${xmlAttrEscape(moduleName)}" />
    <option name="WORKING_DIRECTORY" value="${xmlAttrEscape(workingDirMacro)}" />
    <option name="PROGRAM_PARAMETERS" value="${xmlAttrEscape(createServerRunArgumentsForIdea([]))}" />
    <method v="2" />
  </configuration>
</component>
"""

        def withDebuggerXml = """<component name="ProjectRunConfigurationManager">
  <configuration default="false" name="HytaleServer + WorldGenDebugger (Skylandsea)" type="Application" factoryName="Application">
    <option name="MAIN_CLASS_NAME" value="com.hypixel.hytale.Main" />
    <module name="${xmlAttrEscape(moduleName)}" />
    <option name="WORKING_DIRECTORY" value="${xmlAttrEscape(workingDirMacro)}" />
    <option name="PROGRAM_PARAMETERS" value="${xmlAttrEscape(createServerRunArgumentsForIdea(['$PROJECT_DIR$/../worldgen-web-editor-plugin/build/libs']))}" />
    <method v="2" />
  </configuration>
</component>
"""

        def serverOnlyFile = file("${runDir}/HytaleServer_Skylandsea.run.xml")
        if (!serverOnlyFile.exists()) {
            runDir.mkdirs()
            serverOnlyFile.text = serverOnlyXml
        }
        def withDebuggerFile = file("${runDir}/HytaleServer_WorldGenDebugger_Skylandsea.run.xml")
        if (!withDebuggerFile.exists()) {
            runDir.mkdirs()
            withDebuggerFile.text = withDebuggerXml
        }
    }
}
